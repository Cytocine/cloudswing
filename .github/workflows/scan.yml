# Save as .github/workflows/scan.yml. Runs at :02 and :32 past each hour, 13:00-21:59 UTC on weekdays (covers US market hours, summer and winter).
name: cytocine-scan
on:
  schedule:
    - cron: '2,32 13-21 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scanner.mjs
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ACCT: '25000'
          RISK_PCT: '0.5'
          MAX_POS_PCT: '25'
          TF: '1Hour'       # 30Min | 1Hour
          FILTER: 'cloud'   # off | rise | cloud: must match the app's Signal filter dropdown
          GAP_ATR: '0.1'
          COOLDOWN: '10'
      - run: |
          git config user.name "scan-bot" && git config user.email "scan-bot@users.noreply.github.com"
          git add sent.json && (git diff --cached --quiet || (git commit -m "update sent alerts" && git push))