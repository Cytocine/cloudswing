      const prev=a.slice(-21,-1),avg=prev.reduce((x,b)=>x+b.v,0)/prev.length;

    }

  }catch(e){if(!isAbort(e))status('RVOL error: '+e.message)}

async function loadTrend(force=false){
  if(tab==='v'){renderRows();return}
  const run=++trendRun,t=tf;
  const base=scanSymbols();if(!(akey()&&asec())||!base.length){renderRows();return}
  if(force)for(const k in trendAt)delete trendAt[k];
  const syms=base.filter(s=>stale(trendAt,s,trendTTL()));
  if(!syms.length){trendReady=true;renderRows();if(tab==='w'){loadHtf(force);loadRvol(force);loadM30(force)}return}
  trendReady=false;renderRows();
  const span=t==='eod'?730:Math.max(1,+$('days').value||3)*2+5;
  try{
    const all=await rawBars(syms,t,span,{signal:scope('trend'),force});
    if(run!==trendRun)return;
    for(const s of syms){
      const bars=clean((all[s]||[]).map(b=>({time:t==='eod'?b.t.slice(0,10):etSec(Date.parse(b.t)),open:b.o,high:b.h,low:b.l,close:b.c,volume:b.v})));
      trendAt[s]=Date.now();

      const I=indicator(bars),n=bars.length-1;
      let chg=null;{const intra=typeof bars[n].time==='number',ld=intra?Math.floor(bars[n].time/86400):0;let pc=null;if(!intra){if(n>0)pc=bars[n-1].close}else for(let k=n;k>=0;k--)if(Math.floor(bars[k].time/86400)<ld){pc=bars[k].close;break}if(pc)chg=(bars[n].close/pc-1)*100}
      trend[s]=I.avwap[n]>0?{bull:I.bull[n],gap:(I.slow[n]/I.avwap[n]-1)*100,buy:buyAgo(bars,I),last:bars[n].close,av:I.avwap[n],chg}:{bull:false,gap:-999,buy:null,last:bars[n].close,av:I.avwap[n],chg};
      if(typeof bars[n].time==='number'&&window.logSig){const tb=trend[s].buy;if(tb!=null&&tb<=1)logSig(s,bars[n-tb],t);updJ(s,bars,t)}
    }

    window.loadReg&&loadReg(force);
  }catch(e){if(run===trendRun&&!isAbort(e))status('Trend scan error: '+e.message)}
}

const $=id=>document.getElementById(id);

// ---------- storage (keys, settings, drawings persist in this browser) ----------
let ls=null,lsName='';for(const s of['localStorage','sessionStorage']){try{const o=window[s];o.setItem('_t','1');o.removeItem('_t');ls=o;lsName=s;break}catch(e){}}

let rows=[],raw=[],clouds=[],lines=[],D=[],hist=[],SYM='',tool='sel',selD=null,hovD=null,cur=null,drag=null,hide=false,magnet=false,step=900,busy=false,tab='C',loadId=0,ORDER=[];

let wl=[];try{wl=JSON.parse(store.get('cw')||'null')}catch(e){}
wl=Array.isArray(wl)?[...new Set(wl.map(x=>String(x).trim().toUpperCase()).filter(x=>SYM_OK.test(x)))]:[];

// Focus: star a few symbols and switch Focus on to track only those (the full list stays saved).

const TABID=Math.random().toString(36).slice(2);

function wsConnect(){
 if(ws||wsFatal||!$('live').checked||!$('key').value||!$('sec').value||$('px').value.trim())return;
 if(!wsLock()){setWs('stream open in another tab (polling here)');setTimeout(wsConnect,8000);return}
 let w;setWs('… connecting');
 try{w=new WebSocket(`wss://stream.data.alpaca.markets/v2/${$('feed').value}`)}catch(e){setWs('stream unavailable','var(--dn)');return}
 ws=w;
 w.onmessage=e=>{let a;try{a=JSON.parse(e.data)}catch(_){return}
  for(const m of a){
   if(m.T==='success'&&m.msg==='connected')w.send(JSON.stringify({action:'auth',key:$('key').value.trim(),secret:$('sec').value.trim()}));
   else if(m.T==='success'&&m.msg==='authenticated'){wsOk=true;wsDelay=2000;wsSubs=new Set();setWs('● streaming','var(--up)');wsSync()}
   else if(m.T==='error'){
    if(m.code===405){ // symbol limit: shrink the list, drop everything, resubscribe the priority symbols only
     wsCap=Math.max(1,Math.min(wsCap||30,Math.max(1,wsSubs.size||30)-5));
     try{ws.send(JSON.stringify({action:'unsubscribe',trades:[...wsSubs]}))}catch(_){}
     wsSubs=new Set();setWs('● streaming (top '+wsCap+' symbols — plan symbol limit)','var(--up)');setTimeout(wsSync,500);continue}
    wsOk=false;
    if([401,402,409].includes(m.code)){wsFatal=true;setWs('stream: '+m.msg,'var(--dn)')}
    else if(m.code===406){wsDelay=Math.max(wsDelay,5000);setWs('stream: connection limit — another tab/app/device is using these keys (retrying)','var(--dn)')}
    else setWs('stream: '+m.msg,'var(--dn)')}
   else if(m.T==='t')onTrade(m)}};
 w.onclose=()=>{if(ws!==w)return;ws=null;wsOk=false;wsSubs=new Set();if(!wsFatal&&wsDelay<30000)setWs('○ reconnecting…');setTimeout(wsConnect,wsDelay);wsDelay=Math.min(wsDelay*2,30000)}}

  if(dly){if(!l)return false;const td=et(t).d,ld=et(Date.parse(l.t)/1e3).d;

   return false}
  if(l&&l.t===iso){l.h=Math.max(l.h,p);l.l=Math.min(l.l,p);l.c=p;l.v+=sz;l.s=1;return true}

<script>
(()=>{

function syncKeys(){for(const[a,b]of PAIRS){const x=st.get(a),y=st.get(b);if(x&&!y)st.set(b,x);else if(y&&!x)st.set(a,y)}}
const apps={G:{btn:$('bG'),id:'appG',fr:null,name:'Gainers'},C:{btn:$('bC'),id:'appC',fr:null,name:'Cytocine'},P:{btn:$('bP'),id:'appP',fr:null,name:'Portfolio'}};

function vis(a){const f=a.fr;if(!f)return;try{const d=f.contentDocument;if(!d)return;
  const off=()=>f.hidden;
  Object.defineProperty(d,'hidden',{configurable:true,get:()=>off()||hd.get.call(d)});

  d.dispatchEvent(new Event('visibilitychange',{bubbles:true}));
  f.contentWindow.dispatchEvent(new Event('resize'))}catch{}}
function show(k){
  syncKeys();
  const a=apps[k];

    f.addEventListener('load',()=>{$('load').hidden=true;vis(a)});f.srcdoc=dec(a.id);$('host').appendChild(f);a.fr=f}
