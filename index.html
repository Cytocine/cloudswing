<script>
(()=>{
const $=id=>document.getElementById(id);
const st={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
const dec=id=>{const b=atob($(id).textContent.trim());return new TextDecoder().decode(Uint8Array.from(b,c=>c.charCodeAt(0)))};
// Alpaca keys are stored under different names by each app; keep them in step.
const PAIRS=[['alpKey','ck'],['alpSec','cs']];
function syncKeys(){for(const[a,b]of PAIRS){const x=st.get(a),y=st.get(b);if(x&&!y)st.set(b,x);else if(y&&!x)st.set(a,y)}}
const apps={G:{btn:$('bG'),id:'appG',fr:null},C:{btn:$('bC'),id:'appC',fr:null}};
function show(k){
  syncKeys();
  const a=apps[k];
  if(!a.fr){const f=document.createElement('iframe');f.title=k==='G'?'Gainers':'Cytocine';f.setAttribute('allow','clipboard-write; fullscreen');f.srcdoc=dec(a.id);$('host').appendChild(f);a.fr=f}
  for(const j in apps){apps[j].btn.classList.toggle('on',j===k);if(apps[j].fr)apps[j].fr.hidden=j!==k}
  st.set('mergedApp',k);
  try{a.fr.contentWindow.dispatchEvent(new Event('resize'))}catch{}
}
$('bG').onclick=()=>show('G');$('bC').onclick=()=>show('C');
show(st.get('mergedApp')==='C'?'C':'G');
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script></body></html>
